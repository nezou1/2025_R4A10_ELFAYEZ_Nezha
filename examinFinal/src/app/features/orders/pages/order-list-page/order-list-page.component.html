<div class="order-page">
  <h1 class="order-title">Liste des commandes</h1>

  @if (orders.length) {
  <div>
    @for (order of orders; track $index) {
        <app-order-card [order]="order" (deleteOrder)="onDelete($event)"></app-order-card>
    }
  </div>
  } @else {
  <p>Aucune commande pour le moment.</p>
  }

</div>
